name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks CLI
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$tool_dir"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive" \
            --output "$tool_dir/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tool_dir/$archive" | sha256sum --check --strict
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" gitleaks
      - name: Scan all fetched Git history with fully redacted findings
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts="--all" --redact=100 --no-banner
