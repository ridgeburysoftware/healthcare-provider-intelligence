version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 3
  - package-ecosystem: terraform
    directories:
      - /infra/aws/ecs
      - /infra/aws/glue
    schedule:
      interval: weekly
    groups:
      terraform-providers:
        patterns: ['*']
    open-pull-requests-limit: 3
