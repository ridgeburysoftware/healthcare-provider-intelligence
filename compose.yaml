name: healthcare-provider-intelligence
services:
  app:
    build: .
    ports: ["127.0.0.1:${APP_PORT:-8520}:8510"]
    environment:
      NEO4J_URI: bolt://graph:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASS: ${NEO4J_PASS:?Run python scripts/configure_local.py first}
      BEDROCK_MODEL_ID: ${BEDROCK_MODEL_ID:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    depends_on:
      graph:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
  graph:
    image: neo4j:5
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-17474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-17687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASS:?Run python scripts/configure_local.py first}"
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    volumes: [provider-graph-data:/data]
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, "wget --no-verbose --tries=1 --spider http://localhost:7474/ || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 30
volumes:
  provider-graph-data: {}
